version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: brizcore_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brizcore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brizcore_pass}
      POSTGRES_DB: ${POSTGRES_DB:-brizcore_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brizcore_user -d brizcore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brizcore_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://brizcore_user:brizcore_pass@db:5432/brizcore_db
      SECRET_KEY: ${SECRET_KEY:-brizcore_super_secret_jwt_key_2026}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: brizcore_web
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
